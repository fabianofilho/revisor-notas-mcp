[project]
name = "revisor-notas-mcp"
version = "0.1.0"
description = "Servidor MCP que valida notas clínicas SOAP (#TELEMEDICINA#) inteiramente local e offline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "typer>=0.15",
]

[project.scripts]
revisor-notas-mcp = "revisor_notas_mcp.mcp_server.server:main"
revisor-cli = "revisor_notas_mcp.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revisor_notas_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer declara os argumentos como default da funcao; e o idioma da biblioteca.
"src/revisor_notas_mcp/cli.py" = ["B008"]
# As notas de exemplo sao copias fieis do template: quebrar linha mudaria o dado.
"tests/fixtures/__init__.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
